[workspace]
authors = ["Michael Tran <mtran256@uwo.ca>"]
channels = ["conda-forge", "bioconda"]
name = "nci-almanac-pset-curation"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
setup = { cmd = "Rscript --vanilla workflow/scripts/setup.R", description = "Explicitly install latest GitHub CoreGx/PharmacoGx and record resolved SHAs." }
pipeline = { cmd = "snakemake --snakefile workflow/Snakefile --cores 1", description = "Skeleton only: deliberately stops before curation." }
qc = { cmd = "Rscript --vanilla -e \"rmarkdown::render('workflow/qc/pset_qc.Rmd', output_file = 'pset_qc.html', output_dir = 'docs', knit_root_dir = getwd())\"", description = "Render QC once implemented; currently stops with a template message." }
zipup = { cmd = "bash -o pipefail -c 'test -d data/results/tables && tar -cf - -C data/results tables | gzip -9 > data/results/tables.tar.gz'", description = "Archive future TSV exports; requires an existing tables directory." }

[dependencies]
snakemake-minimal = ">=9.27.0,<10"
r-base = ">=4.5.3,<4.6"
r-remotes = ">=2.5.0,<3"
r-biocmanager = ">=1.30.27,<2"
r-yaml = ">=2.3.12,<3"
r-rmarkdown = ">=2.32,<3"
pandoc = ">=3.12.1,<4"
pyyaml = ">=6.0.3,<7"
